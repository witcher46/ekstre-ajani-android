name: Android preview APK
on:
  pull_request:
    paths: ['android_app/**', '.github/workflows/android-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test money, PDF text and backup logic
        run: node --test android_app/tests/core.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build test APK
        run: gradle -p android_app assembleDebug lintDebug --no-daemon
      - name: Verify APK signature and hash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android_app/app/build/outputs/apk/debug/app-debug.apk
          cd android_app/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test offline app and PDF engine on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          working-directory: android_app
          script: gradle connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ekstre-ajani-android-deneme
          path: |
            android_app/app/build/outputs/apk/debug/app-debug.apk
            android_app/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-reports
          path: android_app/app/build/reports/
