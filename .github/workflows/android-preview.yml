name: Android preview APK
on:
  pull_request:
    paths: ['android_app/**', '.github/workflows/android-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test money, PDF text and backup logic
        run: node --test android_app/tests/*.test.mjs
      - name: Run browser journeys and overlap checks
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" playwright
          export PLAYWRIGHT_PATH="$RUNNER_TEMP/browser-tests/node_modules/playwright"
          node "$PLAYWRIGHT_PATH/cli.js" install --with-deps chromium
          export CHROME_PATH=$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -o -path '*/chrome-linux/chrome' | head -1)
          node android_app/tests/ui.cjs
          node android_app/tests/audit.cjs
          node android_app/tests/journey.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build test APK
        run: gradle -p android_app assembleDebug lintDebug --no-daemon
      - name: Verify APK signature and hash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android_app/app/build/outputs/apk/debug/app-debug.apk
          cd android_app/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 42429142631
          name: ekstre-ajani-android-deneme
          path: android_app/test-output/previous-apk
      - name: Test offline app and PDF engine on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          working-directory: android_app
          script: |
            adb install -r test-output/previous-apk/app-debug.apk
            adb shell settings put secure show_ime_with_hard_keyboard 1
            result=0
            gradle connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --no-daemon || result=$?
            adb pull /sdcard/Android/data/com.zagor.ekstre.preview.revision/files/screens test-output/android-screens || result=1
            exit "$result"
      - name: Report native test diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import base64, glob, pathlib, xml.etree.ElementTree as ET
          for name in glob.glob('android_app/app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              root = ET.parse(name).getroot()
              print('ANDROID_TEST_RESULT', name, root.attrib)
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      print('ANDROID_TEST_FAILURE', case.attrib, failure.attrib, failure.text)
          for name in glob.glob('android_app/test-output/android-screens/*.png'):
              p = pathlib.Path(name)
              data = base64.b64encode(p.read_bytes()).decode()
              parts = [data[i:i+4096] for i in range(0, len(data), 4096)]
              for index, part in enumerate(parts):
                  print('ANDROID_SCREEN_PART', p.name, index, len(parts), part)
          for name in glob.glob('android_app/test-output/android-screens/*.json'):
              p = pathlib.Path(name)
              print('ANDROID_GEOMETRY', p.name, p.read_text())
          for name in glob.glob('android_app/test-output/android-screens/*.xml'):
              p = pathlib.Path(name)
              print('ANDROID_UI', p.name, p.read_text())
          for name in glob.glob('android_app/test-output/android-screens/*.txt'):
              p = pathlib.Path(name)
              print('ANDROID_WINDOW', p.name)
              for line in p.read_text().splitlines():
                  if any(key in line for key in ['package=', 'mCurrentFocus', 'mFocusedApp', 'mAwake', 'Keyguard', 'keyguard', 'mShowingLockscreen', 'mScreenOn', 'mInputMethodTarget']):
                      print(line)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ekstre-ajani-android-revision-0.1.1
          path: |
            android_app/app/build/outputs/apk/debug/app-debug.apk
            android_app/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-revision-reports
          path: |
            android_app/app/build/reports/
            android_app/test-output/**/*.png
            android_app/test-output/**/result.json
            android_app/test-output/**/layout-results.json
