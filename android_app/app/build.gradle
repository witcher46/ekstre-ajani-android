plugins { id 'com.android.application' }
android {
 namespace 'com.zagor.ekstre'
 compileSdk 35
 defaultConfig { applicationId 'com.zagor.ekstre.preview'; minSdk 26; targetSdk 35; versionCode 5; versionName '0.3.0-deneme'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 defaultConfig.manifestPlaceholders = [appLabel: 'Ekstre Ajanı Cüzdan']
 testBuildType = providers.gradleProperty('trialDeviceTest').isPresent() ? 'trial' : 'debug'
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes {
  debug {
   debuggable true
   applicationIdSuffix '.wallet'
  }
  trial {
   initWith debug
   applicationIdSuffix '.wallet.trial.v3'
   manifestPlaceholders = [appLabel: 'Ekstre Ajanı Cüzdan 0.3 Deneme']
   matchingFallbacks = ['debug']
  }
 }
 packaging { resources.excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/LICENSE.txt','META-INF/NOTICE','META-INF/NOTICE.txt'] }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
