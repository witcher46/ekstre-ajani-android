plugins { id 'com.android.application' }
android {
 namespace 'com.zagor.ekstre'
 compileSdk 35
 defaultConfig { applicationId 'com.zagor.ekstre.preview'; minSdk 26; targetSdk 35; versionCode 2; versionName '0.1.1-deneme'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { debug { debuggable true; applicationIdSuffix '.revision' } }
 packaging { resources.excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/LICENSE.txt','META-INF/NOTICE','META-INF/NOTICE.txt'] }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
